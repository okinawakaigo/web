name: Website CI/CD

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.npmrc'
      - 'stylelint.config.mjs'
      - 'eslint.config.mjs'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'
  PUBLIC_SITE_URL: 'https://recruit.okinawakaigo.com'
  # This site is for private review until its content is approved for publication.
  PUBLIC_SITE_INDEXABLE: 'false'
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}
  PUBLIC_CONSULTATION_ENABLED: ${{ vars.PUBLIC_CONSULTATION_ENABLED || 'false' }}
  PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @okinawa-care/api exec wrangler deploy --dry-run
      - run: pnpm --filter @okinawa-care/api exec wrangler deploy --config wrangler.dashboard.jsonc --dry-run
      - name: Deploy recruit and dashboard to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_FROM: ${{ secrets.NOTIFICATION_FROM }}
          NOTIFICATION_TO: ${{ secrets.NOTIFICATION_TO }}
        run: pnpm --filter @okinawa-care/api deploy
