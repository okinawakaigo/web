name: Website CI/CD

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://okinawakaigo.com' }}
  PUBLIC_SITE_INDEXABLE: ${{ vars.PUBLIC_SITE_INDEXABLE || 'false' }}
  PUBLIC_ANALYTICS_ENABLED: ${{ vars.PUBLIC_ANALYTICS_ENABLED || 'false' }}
  PUBLIC_RESERVATION_URL: ${{ vars.PUBLIC_RESERVATION_URL }}
  PUBLIC_FORM_SOURCE_FIELD: ${{ vars.PUBLIC_FORM_SOURCE_FIELD }}
  PUBLIC_FORM_MEDIUM_FIELD: ${{ vars.PUBLIC_FORM_MEDIUM_FIELD }}
  PUBLIC_FORM_ROLE_FIELD: ${{ vars.PUBLIC_FORM_ROLE_FIELD }}
  PUBLIC_FORM_STEP_FIELD: ${{ vars.PUBLIC_FORM_STEP_FIELD }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @okinawa-care/edge exec wrangler deploy --dry-run
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret before deploying. See docs/deployment.md.'
            exit 1
          fi
          pnpm --filter @okinawa-care/edge deploy
